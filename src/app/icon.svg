<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="MIZAN">
  <!-- MIZAN brand mark: deep red ground, gold inner ring, meem glyph -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a8382f"/>
      <stop offset="1" stop-color="#8c2b26"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#g)"/>
  <rect x="7" y="7" width="50" height="50" rx="11" fill="none" stroke="#c9a253" stroke-width="2.5" opacity="0.85"/>
  <text x="32" y="45" text-anchor="middle" font-family="IBM Plex Sans Arabic, Noto Sans Arabic, sans-serif" font-size="38" font-weight="700" fill="#faf7f0">م</text>
</svg>
